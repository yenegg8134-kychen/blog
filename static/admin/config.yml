# 網站後台設定（Sveltia CMS）
backend:
  name: github
  repo: yenegg8134-kychen/blog
  branch: main
  base_url: https://cms-oauth.kychen.de5.net

# 上傳的圖片預設位置（文章配圖建議直接放在各篇文章資料夾內）
media_folder: static/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: 文章
    label_singular: 文章
    folder: content/blog
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    fields:
      - { label: 標題, name: title, widget: string }
      - { label: 發布日期, name: date, widget: datetime, required: false }
      - { label: 下架（打開即隱藏此文）, name: draft, widget: boolean, default: false }
      - { label: 作者, name: authors, widget: hidden, default: ['me'] }
      - { label: 標籤, name: tags, widget: list, required: false }
      - { label: 摘要, name: summary, widget: text, required: false }
      - { label: 內文, name: body, widget: markdown }
