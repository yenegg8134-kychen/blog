name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Hugo extended
        run: |
          wget -qO hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v0.167.0/hugo_extended_0.167.0_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: hugo --minify && npx pagefind --site public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c936f3a4751c9b14f4c93c449d2369ab
          command: pages deploy public --project-name=yuanlao-blog --commit-dirty=true

      - name: Set CMS OAuth secrets
        run: |
          if [ -n "${{ secrets.CMS_OAUTH_CLIENT_ID }}" ]; then
            echo "${{ secrets.CMS_OAUTH_CLIENT_ID }}" | npx -y wrangler pages secret put GITHUB_CLIENT_ID --project-name=yuanlao-blog
            echo "${{ secrets.CMS_OAUTH_CLIENT_SECRET }}" | npx -y wrangler pages secret put GITHUB_CLIENT_SECRET --project-name=yuanlao-blog
          else
            echo "CMS OAuth secrets not configured, skipping."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c936f3a4751c9b14f4c93c449d2369ab
