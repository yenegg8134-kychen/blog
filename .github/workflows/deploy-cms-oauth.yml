name: Deploy CMS OAuth worker

on:
  push:
    paths: ['workers/cms-oauth/**', '.github/workflows/deploy-cms-oauth.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy worker
        working-directory: workers/cms-oauth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy

      - name: Set worker secrets
        working-directory: workers/cms-oauth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.CMS_OAUTH_CLIENT_ID }}" | wrangler secret put GITHUB_CLIENT_ID
          echo "${{ secrets.CMS_OAUTH_CLIENT_SECRET }}" | wrangler secret put GITHUB_CLIENT_SECRET
